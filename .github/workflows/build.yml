name: build deb

on:
  push:
    branches-ignore:
      - dev
  pull_request:
    branches-ignore:
      - dev

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4.2.2
        with:
          submodules: true
          fetch-depth: 0

      - name: Apply custom download filename patch
        run: |
          python3 .github/scripts/apply_filename_patch.py .
          python3 .github/scripts/resolve_full_aweme.py .
          python3 .github/scripts/fix_api_download_rename.py .
          python3 .github/scripts/bind_api_quality_context.py .
          git diff -- DYYYManager.h DYYYManager.m DYYYLongPressPanel.xm

      - name: Check cache
        run: |
          echo upstream_heads=`git ls-remote https://github.com/roothide/theos | head -n 1 | cut -f 1`-`git ls-remote https://github.com/theos/sdks | head -n 1 | cut -f 1` >> $GITHUB_ENV

      - name: Use cache
        id: cache
        uses: actions/cache@v4.2.1
        with:
          path: ${{ github.workspace }}/theos
          key: ${{ runner.os }}-${{ env.upstream_heads }}

      - name: Prepare Theos
        uses: huami1314/theos-action@main

      - name: Setup GNU Make
        run: |
          echo "$(brew --prefix)/opt/make/libexec/gnubin" >> $GITHUB_PATH

      - name: Build rootful package and collect injection dylib
        run: |
          rm -rf packages build-artifacts
          mkdir -p build-artifacts
          make package FINALPACKAGE=1 -j$(sysctl -n hw.ncpu)
          DYYYPATH=$(find .theos -type f -name 'DYYY.dylib' | head -n 1)
          if [ -z "$DYYYPATH" ]; then
            echo "DYYY.dylib not found after rootful build"
            exit 1
          fi
          cp -f "$DYYYPATH" build-artifacts/DYYY.dylib
          file build-artifacts/DYYY.dylib

      - name: Build rootless package
        run: |
          make package THEOS_PACKAGE_SCHEME=rootless FINALPACKAGE=1 -j$(sysctl -n hw.ncpu)

      - name: Build roothide package
        run: |
          make package THEOS_PACKAGE_SCHEME=roothide FINALPACKAGE=1 -j$(sysctl -n hw.ncpu)

      - name: Upload Actions artifacts
        uses: actions/upload-artifact@v4.6.0
        with:
          name: DYYY-custom-build
          path: |
            ${{ github.workspace }}/packages/*.deb
            ${{ github.workspace }}/build-artifacts/DYYY.dylib

      - name: Move custom-latest tag
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git tag -f custom-latest "$GITHUB_SHA"
          git push origin refs/tags/custom-latest --force

      - name: Publish Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: custom-latest
          name: DYYY Custom Latest
          body: |
            Custom build based on masakacj/DYYY main.

            Download filename format:
            `作者名字_抖音号_yyyyMMdd_HHmm.ext`

            API download metadata is captured per request and carried into each quality-selection action, so clicking 原画/720P uses the work that opened that quality menu rather than global previous-download state.

            Multi-image resources append `_01`, `_02`, etc.
          prerelease: false
          make_latest: true
          overwrite_files: true
          files: |
            packages/*.deb
            build-artifacts/DYYY.dylib
