name: build deb

on:
  push:
    branches-ignore:
      - dev
  pull_request:
    branches-ignore:
      - dev

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4.2.2
        with:
          submodules: true

      - name: Apply custom download filename patch
        run: |
          python3 .github/scripts/apply_filename_patch.py .
          git diff -- DYYYManager.h DYYYManager.m DYYYLongPressPanel.xm

      - name: Check cache
        run: |
          echo upstream_heads=`git ls-remote https://github.com/roothide/theos | head -n 1 | cut -f 1`-`git ls-remote https://github.com/theos/sdks | head -n 1 | cut -f 1` >> $GITHUB_ENV

      - name: Use cache
        id: cache
        uses: actions/cache@v4.2.1
        with:
          path: ${{ github.workspace }}/theos
          key: ${{ runner.os }}-${{ env.upstream_heads }}

      - name: Prepare Theos
        uses: huami1314/theos-action@main

      - name: Setup GNU Make
        run: |
          echo "$(brew --prefix)/opt/make/libexec/gnubin" >> $GITHUB_PATH

      - name: Build package
        run: |
          rm -f packages/*
          make package FINALPACKAGE=1 -j$(sysctl -n hw.ncpu)
          make package THEOS_PACKAGE_SCHEME=rootless FINALPACKAGE=1 -j$(sysctl -n hw.ncpu)
          make package THEOS_PACKAGE_SCHEME=roothide FINALPACKAGE=1 -j$(sysctl -n hw.ncpu)

      - name: Collect dylib
        if: always()
        run: |
          mkdir -p build-artifacts
          find .theos -type f -name 'DYYY.dylib' -print -exec cp -f {} build-artifacts/DYYY.dylib \; || true

      - name: Upload specific Deb packages
        uses: actions/upload-artifact@v4.6.0
        with:
          name: DYYY-deb
          path: ${{ github.workspace }}/packages/*.deb

      - name: Upload DYYY dylib
        uses: actions/upload-artifact@v4.6.0
        with:
          name: DYYY-dylib
          path: ${{ github.workspace }}/build-artifacts/DYYY.dylib
          if-no-files-found: warn
